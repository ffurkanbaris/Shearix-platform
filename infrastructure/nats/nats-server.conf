# NATS server configuration for both the dev Compose stack and production.
# Client authentication is always required - there is no anonymous-access
# fallback. Dev gets convenient (but real) credentials via docker-compose.yml
# defaults; production requires NATS_USER/NATS_PASSWORD to be set with no
# fallback (see infrastructure/caddy/docker-compose.production.yml).
#
# $NATS_USER/$NATS_PASSWORD are resolved from the container's own process
# environment at server startup (a standard nats-server config feature -
# see https://docs.nats.io/running-a-nats-service/configuration#variables).
# The HTTP monitoring endpoint (8222, used by this repo's healthcheck) is
# intentionally left unauthenticated: it exposes no client data, only server
# health/stats, and is reachable only from the private Docker network.
jetstream {
  store_dir: "/data"
}
http_port: 8222
authorization {
  user: $NATS_USER
  password: $NATS_PASSWORD
}
