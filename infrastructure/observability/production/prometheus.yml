global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: {environment: production}

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

scrape_configs:
  - job_name: barber-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway-service:8080
          - tenant-service:8080
          - auth-service:8080
          - barber-service:8080
          - catalog-service:8080
          - scheduling-service:8080
          - appointment-service:8080
          - customer-service:8080
          - notification-service:8080
  - job_name: prometheus
    static_configs: [{targets: ["prometheus:9090"]}]
  - job_name: alertmanager
    static_configs: [{targets: ["alertmanager:9093"]}]
  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8888"]}]
  - job_name: loki
    static_configs: [{targets: ["loki:3100"]}]
  - job_name: tempo
    static_configs: [{targets: ["tempo:3200"]}]
